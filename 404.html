    <script>
      (function () {
        const LOVABLE_SELECTORS = [
          'a[href*="lovable.dev"]',
          'a[href*="lovable.app"]',
          'img[src*="lovable"]',
          'iframe[src*="lovable"]',
          'script[src*="lovable"]',
          '[data-lovable]',
          '[data-lovable-badge]',
          '[id*="lovable"]',
          '[id*="lovable-badge"]',
          '[class*="lovable"]',
          '[class*="lovable-badge"]',
        ];

        const LOVABLE_TEXT_PATTERNS = [/made with lovable/i, /built with lovable/i, /edit with lovable/i];

        const hideElement = (element) => {
          if (!(element instanceof HTMLElement)) return;
          element.style.setProperty("display", "none", "important");
          element.style.setProperty("visibility", "hidden", "important");
          element.style.setProperty("opacity", "0", "important");
          element.style.setProperty("pointer-events", "none", "important");
        };

        const findLovableContainer = (node) => {
          if (!(node instanceof HTMLElement)) return null;

          let current = node;
          while (current && current !== document.body) {
            if (LOVABLE_SELECTORS.some((selector) => current.matches(selector))) return current;

            const computedStyle = window.getComputedStyle(current);
            const text = current.textContent?.trim() ?? "";
            const isBrandingText = text.length > 0 && LOVABLE_TEXT_PATTERNS.some((pattern) => pattern.test(text));
            const isFloatingBadge = ["fixed", "sticky"].includes(computedStyle.position);

            if (isBrandingText && isFloatingBadge) return current;
            current = current.parentElement;
          }

          return LOVABLE_SELECTORS.some((selector) => node.matches(selector)) ? node : null;
        };

        const shouldRemove = (node) => {
          if (!(node instanceof HTMLElement)) return false;
          if (LOVABLE_SELECTORS.some((selector) => node.matches(selector))) return true;

          const text = node.textContent?.trim() ?? "";
          return text.length > 0 && LOVABLE_TEXT_PATTERNS.some((pattern) => pattern.test(text));
        };

        const removeLovableBranding = (root) => {
          if (!(root instanceof HTMLElement || root instanceof Document)) return;

          LOVABLE_SELECTORS.forEach((selector) => {
            root.querySelectorAll(selector).forEach((element) => {
              const container = findLovableContainer(element) ?? element;
              hideElement(container);
              container.remove();
            });
          });

          if (root instanceof HTMLElement && shouldRemove(root)) {
            const container = findLovableContainer(root) ?? root;
            hideElement(container);
            container.remove();
          }
        };

        const startObserver = () => {
          removeLovableBranding(document);

          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (!(node instanceof HTMLElement)) return;
                removeLovableBranding(node);

                if (shouldRemove(node)) {
                  const container = findLovableContainer(node) ?? node;
                  hideElement(container);
                  container.remove();
                }
              });
            });
          });

          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["class", "id", "style", "href", "src", "data-lovable", "data-lovable-badge"],
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startObserver, { once: true });
        } else {
          startObserver();
        }
      })();
    </script>
